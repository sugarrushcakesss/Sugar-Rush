<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="shortcut icon" href="img/Sugar Rush.png" type="image/x-icon">
    <title>Recuperar Contraseña - Sugar Rush</title>
    <link rel="stylesheet" href="estilos1.css">
</head>
<body>
    <div class="login-box">
        <h2>Recuperar Contraseña</h2>
        <p style="color: #fff; font-size: 14px; text-align: center; margin-bottom: 20px;">
            Ingresa tu correo electrónico para restablecer tu contraseña.
        </p>
        <form action="login.html" method="post">
            <label for="usuario">Correo Electrónico</label>
            <input type="email" id="usuario" name="usuario" required>

            <input type="submit" value="Enviar Enlace">
        </form>
        <div class="extra">
            <p><a href="login.html">Regresar al Login</a></p>
        </div>
    </div>
</body>
</html>
